name: Daily LinkedIn content

on:
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = show content in logs; publish = queue to Buffer'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: write

concurrency:
  group: daily-linkedin
  cancel-in-progress: false

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional image dependencies
        run: pip install huggingface_hub pillow
      - name: Test code
        run: python -m unittest discover -s tests -v
      - name: Generate preview or queue post
        if: github.event_name == 'workflow_dispatch' || vars.AUTO_POST_ENABLED == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          AUTO_POST_ENABLED: ${{ vars.AUTO_POST_ENABLED || 'false' }}
          ENABLE_POST_IMAGE: ${{ vars.ENABLE_POST_IMAGE || 'true' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: ${{ vars.HF_IMAGE_MODEL || 'black-forest-labs/FLUX.1-schnell' }}
          GITHUB_PAGES_BASE_URL: ${{ vars.GITHUB_PAGES_BASE_URL }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
        run: python scripts/post_daily.py --mode "$RUN_MODE"
      - name: Update posting history in repository
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/post_history.json
          if git diff --cached --quiet; then
            echo "No new post to record."
          else
            git commit -m "Record daily LinkedIn Buffer post"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
